services:
  - type: web
    name: craftworld-companion-api
    runtime: node
    plan: starter
    rootDir: apps/api
    buildCommand: cd ../.. && corepack enable && pnpm install --no-frozen-lockfile && pnpm -r build
    startCommand: cd ../.. && pnpm --filter @craftworld/api start
    healthCheckPath: /health
    disk:
      name: craftworld-companion-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: /var/data
      - key: CRAFTWORLD_GQL_URL
        value: https://craft-world.gg/graphql
      - key: CRAFTWORLD_APP_VERSION
        value: 1.6.4
      - key: USE_REMOTE_CONFIG
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: craftworld-companion-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: craftworld-companion-redis
          type: keyvalue
          property: connectionString

  - type: web
    name: craftworld-companion-web
    runtime: node
    plan: free
    rootDir: apps/web
    buildCommand: cd ../.. && corepack enable && pnpm install --no-frozen-lockfile && pnpm -r build
    startCommand: cd ../.. && pnpm --filter @craftworld/web start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_API_BASE
        sync: false

  - type: keyvalue
    name: craftworld-companion-redis
    ipAllowList: []
    plan: free

databases:
  - name: craftworld-companion-db
    plan: free
    ipAllowList: []
