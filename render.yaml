services:
  - type: web
    name: craftworld-companion-api
    env: node
    rootDir: apps/api
    buildCommand: cd .. && pnpm install && pnpm -r build
    startCommand: cd .. && pnpm --filter @craftworld/api start
    healthCheckPath: /health
    disk:
      name: craftworld-companion-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: /var/data
      - key: CRAFTWORLD_GQL_URL
        value: https://craft-world.gg/graphql
      - key: CRAFTWORLD_APP_VERSION
        value: 1.6.4
      - key: USE_REMOTE_CONFIG
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: craftworld-companion-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: craftworld-companion-redis
          type: redis
          property: connectionString

  - type: web
    name: craftworld-companion-web
    env: node
    rootDir: apps/web
    buildCommand: cd .. && pnpm install && pnpm -r build
    startCommand: cd .. && pnpm --filter @craftworld/web start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_API_BASE
        fromService:
          name: craftworld-companion-api
          type: web
          property: url

  - type: redis
    name: craftworld-companion-redis
    ipAllowList: []
    plan: free

  - type: pserv
    name: craftworld-companion-db
    env: postgres
    plan: free
    disk:
      name: craftworld-companion-db-disk
      sizeGB: 5

